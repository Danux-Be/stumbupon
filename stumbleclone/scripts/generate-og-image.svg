<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Fond dégradé -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f3a"/>
      <stop offset="100%" style="stop-color:#2d3561"/>
    </linearGradient>
    <!-- Halo central -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#5c6bc0;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:0"/>
    </radialGradient>
    <!-- Halo bouton -->
    <radialGradient id="btnGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7986cb;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#5c6bc0;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Halo d'ambiance -->
  <ellipse cx="600" cy="315" rx="520" ry="300" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Grille de points décoratifs (subtils) -->
  <g opacity="0.07" fill="#7986cb">
    <circle cx="80" cy="80" r="3"/><circle cx="160" cy="80" r="3"/><circle cx="240" cy="80" r="3"/>
    <circle cx="80" cy="160" r="3"/><circle cx="160" cy="160" r="3"/><circle cx="240" cy="160" r="3"/>
    <circle cx="80" cy="240" r="3"/><circle cx="160" cy="240" r="3"/>
    <circle cx="960" cy="390" r="3"/><circle cx="1040" cy="390" r="3"/><circle cx="1120" cy="390" r="3"/>
    <circle cx="960" cy="470" r="3"/><circle cx="1040" cy="470" r="3"/><circle cx="1120" cy="470" r="3"/>
    <circle cx="960" cy="550" r="3"/><circle cx="1040" cy="550" r="3"/><circle cx="1120" cy="550" r="3"/>
  </g>

  <!-- Icône spirale (cercles concentriques stylisés) -->
  <g transform="translate(154,315)" opacity="0.9">
    <circle cx="0" cy="0" r="68" fill="none" stroke="#5c6bc0" stroke-width="3" opacity="0.5"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#7986cb" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#9fa8da" stroke-width="3" opacity="0.75"/>
    <circle cx="0" cy="0" r="12" fill="#9fa8da" opacity="0.9"/>
    <!-- Ligne décorative -->
    <line x1="12" y1="0" x2="28" y2="-20" stroke="#9fa8da" stroke-width="2" opacity="0.6"/>
    <line x1="28" y1="-20" x2="48" y2="-10" stroke="#7986cb" stroke-width="2" opacity="0.5"/>
    <line x1="48" y1="-10" x2="68" y2="-30" stroke="#5c6bc0" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- Titre principal -->
  <text
    x="250" y="280"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="88"
    font-weight="700"
    letter-spacing="-2"
    fill="#ffffff"
    filter="url(#shadow)">StumbUpon</text>
  <text
    x="250" y="355"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="88"
    font-weight="700"
    letter-spacing="-2"
    fill="#9fa8da"
    filter="url(#shadow)">.com</text>

  <!-- Tagline -->
  <text
    x="250" y="420"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="30"
    font-weight="400"
    letter-spacing="1"
    fill="#c5cae9"
    opacity="0.85">One click. One site. The whole web.</text>

  <!-- Séparateur -->
  <rect x="250" y="446" width="64" height="3" rx="2" fill="#5c6bc0" opacity="0.8"/>

  <!-- Bouton décoratif -->
  <g transform="translate(250,490)" filter="url(#shadow)">
    <rect width="200" height="52" rx="26" fill="#5c6bc0"/>
    <rect width="200" height="52" rx="26" fill="url(#btnGlow)"/>
    <text
      x="100" y="33"
      font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
      font-size="20"
      font-weight="600"
      fill="#ffffff"
      text-anchor="middle">🎲 Stumble</text>
  </g>

  <!-- Domaine discret en bas à droite -->
  <text
    x="1148" y="600"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    fill="#5c6bc0"
    opacity="0.6"
    text-anchor="end">stumbupon.com</text>
</svg>
